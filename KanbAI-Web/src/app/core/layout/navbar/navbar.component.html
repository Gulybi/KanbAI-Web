<nav class="navbar">
  <h1 class="navbar__brand">KanbAI</h1>

  @if (currentUser(); as user) {
    <div class="navbar__auth-cluster" role="group" aria-label="Account">
      <span class="navbar__user-name" data-testid="navbar-user-name">
        {{ user.name }}
      </span>
      <button
        type="button"
        class="navbar__logout-btn"
        (click)="onLogout()">
        Logout
      </button>
    </div>
  }
</nav>
