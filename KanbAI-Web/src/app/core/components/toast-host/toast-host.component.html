@if (currentToast(); as toast) {
  <div
    class="toast-host__toast"
    [class.toast-host__toast--success]="toast.tone === 'success'"
    [class.toast-host__toast--info]="toast.tone === 'info'"
    role="status"
    (mouseenter)="onHoverEnter()"
    (mouseleave)="onHoverLeave()"
    (focusin)="onHoverEnter()"
    (focusout)="onHoverLeave()"
  >
    <svg
      class="toast-host__toast-icon"
      xmlns="http://www.w3.org/2000/svg"
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
      focusable="false"
    >
      @if (toast.tone === 'success') {
        <polyline points="20 6 9 17 4 12" />
      } @else {
        <circle cx="12" cy="12" r="10" />
        <line x1="12" y1="8" x2="12" y2="12" />
        <line x1="12" y1="16" x2="12.01" y2="16" />
      }
    </svg>

    <p class="toast-host__toast-message">{{ toast.message }}</p>

    <button
      type="button"
      class="toast-host__toast-dismiss"
      aria-label="Dismiss notification"
      (click)="onDismiss()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    </button>
  </div>
}

<div
  class="toast-host__live"
  role="status"
  aria-live="polite"
  aria-atomic="true"
>
  {{ currentAnnouncement() }}
</div>
