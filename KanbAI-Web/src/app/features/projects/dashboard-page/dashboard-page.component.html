<main class="dashboard-page">
  <app-dashboard-header
    (createClick)="openCreateDialog()"
  ></app-dashboard-header>

  <div class="dashboard-page__content">
    @switch (vm().status) {
      @case ('loading') {
        <app-dashboard-skeleton></app-dashboard-skeleton>
      }
      @case ('success') {
        <app-project-grid
          [projects]="$any(vm()).projects"
          (manageMembersClick)="openMembersDialog($event)"
          (openBoard)="openBoard($event)"
        ></app-project-grid>
      }
      @case ('empty') {
        <app-dashboard-empty-state
          (createClick)="openCreateDialog()"
        ></app-dashboard-empty-state>
      }
      @case ('error') {
        <app-dashboard-error-state
          [message]="$any(vm()).message"
          (retry)="retry()"
        ></app-dashboard-error-state>
      }
    }
  </div>

  @if (partialFailureToast(); as toast) {
    <app-partial-failure-toast
      [projectName]="toast.project.name"
      [message]="toast.message"
      (openBoard)="onPartialToastOpenBoard()"
      (dismiss)="onPartialToastDismiss()"
    ></app-partial-failure-toast>
  }
</main>
