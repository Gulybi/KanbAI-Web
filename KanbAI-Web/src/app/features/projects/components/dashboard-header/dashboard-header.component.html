<header class="dashboard-header">
  <div class="dashboard-header__text">
    <h1 class="dashboard-header__title">Projects</h1>
    <p class="dashboard-header__subtitle">
      Your workspaces in one place — pick one to open its board.
    </p>
  </div>

  <div class="dashboard-header__action">
    <button
      type="button"
      class="dashboard-header__new-project-btn"
      (click)="onCreateClick()"
    >
      <svg
        class="dashboard-header__new-project-btn-icon"
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      New Project
    </button>
  </div>
</header>
