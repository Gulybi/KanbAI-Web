<ul class="project-grid" role="list">
  @for (project of projects; track trackById($index, project)) {
    <li class="project-grid__item" role="listitem">
      <app-project-card
        [project]="project"
        (manageMembersClick)="manageMembersClick.emit($event)"
        (openBoard)="openBoard.emit($event)"
      ></app-project-card>
    </li>
  }
</ul>
