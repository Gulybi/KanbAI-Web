<aside
  class="task-detail-panel"
  role="dialog"
  aria-modal="false"
  [attr.aria-labelledby]="titleId()"
>
  <header class="task-detail-panel__header">
    <div class="task-detail-panel__header-text">
      <h2
        class="task-detail-panel__title"
        [id]="titleId()"
      >{{ task().title }}</h2>
    </div>
    <button
      type="button"
      class="task-detail-panel__close"
      aria-label="Close task details"
      (click)="handleClose()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        viewBox="0 0 16 16"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <line x1="4" y1="4" x2="12" y2="12" />
        <line x1="12" y1="4" x2="4" y2="12" />
      </svg>
    </button>
  </header>

  <div class="task-detail-panel__body">
    <section
      class="task-detail-panel__section"
      [attr.aria-labelledby]="descriptionLabelId()"
    >
      <h3
        class="task-detail-panel__section-label"
        [id]="descriptionLabelId()"
      >Description</h3>

      @if (descriptionDisplay().mode === 'text') {
        <p class="task-detail-panel__description">{{ descriptionDisplay().text }}</p>
      } @else {
        <p class="task-detail-panel__description-empty">No description yet.</p>
      }
    </section>

    <section class="task-detail-panel__section">
      <h3 class="task-detail-panel__section-label">Attachment</h3>
      <div class="task-detail-panel__attachment-section">
        <app-file-dropzone
          [taskId]="task().id"
          [disabled]="resolvedDisabled()"
          [disabledReason]="resolvedDisabledReason()"
          (fileSelected)="handleDropzoneFileSelected($event)"
        />

        @if (uploads().length > 0) {
          <div class="task-detail-panel__upload-list">
            @for (upload of uploads(); track upload.id) {
              <app-upload-progress-row
                [upload]="upload"
                (cancel)="handleCancel($event)"
                (retry)="handleRetry($event)"
                (dismiss)="handleDismiss($event)"
              />
            }
          </div>
        }

        @if (showAttachmentDivider()) {
          <hr class="task-detail-panel__section-divider" aria-hidden="true" />
        }

        <app-attachment-list
          [attachments]="completedAttachments()"
          [fetchState]="listFetchState()"
          (retryFetch)="handleRetryListFetch()"
        />

        <span
          class="task-detail-panel__upload-live"
          aria-live="polite"
          aria-atomic="true"
        >
          {{ uploadLiveMessage() }}
        </span>
      </div>
    </section>
  </div>
</aside>
