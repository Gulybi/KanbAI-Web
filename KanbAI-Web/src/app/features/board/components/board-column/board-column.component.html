<section class="board-column">
  <header class="board-column__header">
    <h2 class="board-column__name">{{ column().name }}</h2>
    <span class="board-column__count" aria-hidden="true">{{ tasks().length }}</span>
    <button
      type="button"
      class="board-column__menu-btn"
      [attr.aria-label]="kebabAriaLabel()"
      [cdkMenuTriggerFor]="columnMenu"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <circle cx="12" cy="5" r="1.5" />
        <circle cx="12" cy="12" r="1.5" />
        <circle cx="12" cy="19" r="1.5" />
      </svg>
    </button>

    <ng-template #columnMenu>
      <div
        class="kanbai-menu"
        cdkMenu
      >
        <button
          type="button"
          class="kanbai-menuitem kanbai-menuitem--destructive"
          cdkMenuItem
          (cdkMenuItemTriggered)="onDeleteColumnActivate()"
        >
          <svg
            class="kanbai-menuitem__icon"
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <polyline points="3 6 5 6 21 6" />
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
            <path d="M10 11v6" />
            <path d="M14 11v6" />
            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
          </svg>
          <span class="kanbai-menuitem__label">Delete column</span>
        </button>
      </div>
    </ng-template>
  </header>
  @if (column().colorCode) {
    <div
      class="board-column__accent"
      [style.background]="column().colorCode"
      aria-hidden="true"
    ></div>
  }
  <div
    class="board-column__list"
    role="list"
    [attr.aria-label]="dropListAriaLabel()"
    cdkDropList
    [cdkDropListData]="tasks()"
    [cdkDropListConnectedTo]="connectedDropListIds()"
    [id]="dropListId()"
    (cdkDropListDropped)="taskDropped.emit($event)"
  >
    @if (tasks().length === 0) {
      <div class="board-column__empty-zone">
        <p class="board-column__empty-hint">Drop a task here.</p>
      </div>
    } @else {
      @for (task of tasks(); track task.id) {
        <app-task-card
          [task]="task"
          [rollbackTrigger]="triggerFor(task.id)"
          [active]="activeTaskId() === task.id"
          role="listitem"
          cdkDrag
          [cdkDragData]="task"
          (cardActivated)="taskOpened.emit(task)"
        />
      }
    }
  </div>
  <footer class="board-column__footer">
    @if (addTaskOpen()) {
      <app-board-add-task
        [submitting]="addTaskSubmitting()"
        [submitError]="addTaskError()"
        (submitted)="addTaskSubmitted.emit($event)"
        (cancelled)="addTaskCancelled.emit()"
      />
    } @else {
      <button
        type="button"
        class="board-column__add-task"
        [id]="addTaskTriggerId()"
        [attr.aria-label]="addTaskTriggerLabel()"
        (click)="addTaskRequested.emit()"
      >
        Add task
      </button>
    }
  </footer>
</section>
