<article
  class="task-card"
  [class.task-card--rollback]="rolledBack()"
  [class.task-card--active]="active()"
  [attr.aria-label]="accessibleName()"
  tabindex="0"
  role="button"
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (click)="onCardClick()"
  (keydown.enter)="onKeyActivate($event)"
  (keydown.space)="onKeyActivate($event)"
>
  <button
    type="button"
    class="task-card__handle"
    [attr.aria-label]="'Drag ' + task().title"
  >
    <svg
      class="task-card__handle-icon"
      xmlns="http://www.w3.org/2000/svg"
      width="16"
      height="16"
      viewBox="0 0 16 16"
      fill="currentColor"
      aria-hidden="true"
      focusable="false"
    >
      <circle cx="5" cy="4" r="1.25" />
      <circle cx="5" cy="8" r="1.25" />
      <circle cx="5" cy="12" r="1.25" />
      <circle cx="11" cy="4" r="1.25" />
      <circle cx="11" cy="8" r="1.25" />
      <circle cx="11" cy="12" r="1.25" />
    </svg>
  </button>
  <h3 class="task-card__title">{{ task().title }}</h3>
  @if (task().content) {
    <span class="task-card__meta">
      <span class="task-card__meta-dot" aria-hidden="true"></span>
      Notes
    </span>
  }
</article>
