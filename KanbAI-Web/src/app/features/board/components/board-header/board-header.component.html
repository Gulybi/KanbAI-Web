<header class="board-header">
  <h1
    class="board-header__title"
    [title]="project().name"
  >{{ project().name }}</h1>

  <button
    type="button"
    class="board-header__menu-btn"
    aria-label="Project actions"
    [cdkMenuTriggerFor]="boardHeaderMenu"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
      focusable="false"
    >
      <circle cx="12" cy="5" r="1.5" />
      <circle cx="12" cy="12" r="1.5" />
      <circle cx="12" cy="19" r="1.5" />
    </svg>
  </button>

  <ng-template #boardHeaderMenu>
    <div
      class="kanbai-menu"
      cdkMenu
    >
      @if (canDeleteProject()) {
        <button
          type="button"
          class="kanbai-menuitem kanbai-menuitem--destructive"
          cdkMenuItem
          (cdkMenuItemTriggered)="onDeleteProjectActivate()"
        >
          <svg
            class="kanbai-menuitem__icon"
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <polyline points="3 6 5 6 21 6" />
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
            <path d="M10 11v6" />
            <path d="M14 11v6" />
            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
          </svg>
          <span class="kanbai-menuitem__label">Delete project</span>
        </button>
      } @else {
        <div
          class="kanbai-menuitem kanbai-menuitem--destructive kanbai-menuitem--with-hint"
          role="menuitem"
          aria-disabled="true"
        >
          <svg
            class="kanbai-menuitem__icon"
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <polyline points="3 6 5 6 21 6" />
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
            <path d="M10 11v6" />
            <path d="M14 11v6" />
            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
          </svg>
          <span class="kanbai-menuitem__label">Delete project</span>
          <span class="kanbai-menuitem__hint">{{ deleteDisabledHint }}</span>
        </div>
      }
    </div>
  </ng-template>
</header>
